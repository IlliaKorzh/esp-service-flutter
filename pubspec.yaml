name: esp_service
description: >-
  Flutter client of ESP (Email & Push Service): registers the device's FCM
  token, shows push notifications and reports delivery and taps.
  Android only for now; iOS is planned.
version: 0.1.0
repository: https://github.com/IlliaKorzh/esp-service-flutter
issue_tracker: https://github.com/IlliaKorzh/esp-service-flutter/issues
topics:
  - push-notifications
  - fcm
  - firebase-messaging
  - notifications

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

# ESP push works on Android only in this version (see README).
platforms:
  android:

dependencies:
  device_info_plus: ^13.2.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  flutter_udid: ^4.1.6
  http: ^1.6.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
