name: esp_service
description: >-
  Flutter client of ESP (Email & Push Service): registers the device's push
  token (FCM on Android, APNs on iOS), shows push notifications and reports
  delivery and taps.
version: 0.4.0
repository: https://github.com/IlliaKorzh/esp-service-flutter
issue_tracker: https://github.com/IlliaKorzh/esp-service-flutter/issues
topics:
  - push-notifications
  - fcm
  - apns
  - firebase-messaging
  - notifications

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

# Android (FCM) and iOS (APNs). On other platforms every call is a no-op.
platforms:
  android:
  ios:

dependencies:
  device_info_plus: ">=11.2.0 <14.0.0"
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ">=4.1.0 <6.0.0"
  flutter_udid: ^4.1.6
  http: ^1.6.0
  package_info_plus: ">=8.2.1 <11.0.0"
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # Dart only: FCM and local notifications come from firebase_messaging and
      # flutter_local_notifications, so Android has no native code of its own.
      android:
        dartPluginClass: EspServiceAndroid
        dartFileName: src/esp_android_plugin.dart
      # APNs token, permission and notification taps (ios/esp_service).
      ios:
        pluginClass: EspServicePlugin
